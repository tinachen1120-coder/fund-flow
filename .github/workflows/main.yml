name: 每日資金流向報告

on:
  schedule:
    - cron: "7 10 * * 1-5"
    - cron: "7 12 * * 1-5"
  workflow_dispatch:
    inputs:
      backfill:
        description: "回補過去幾個日曆日的台股／港股歷史（首次建議 30，平常留 0）"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: fund-flow
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 抓資料並產生報告
        run: python fund_flow.py --backfill "${{ github.event.inputs.backfill || '0' }}"
      - name: 存回 repo（GitHub Pages 自動更新）
        run: |
          git config user.name "fund-flow-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "資金流向 $(TZ=Asia/Taipei date +%F)"
          git push
